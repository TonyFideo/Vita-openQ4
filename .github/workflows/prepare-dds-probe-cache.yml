name: Prepare reviewed DDS probe cache

on:
  push:
    branches: [dds-probe-cache-preparation]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Apply reviewed patch to immutable source
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config core.sparseCheckout true
          printf '/.github/review/dds-probe-cache.patch.zlib\n' > .git/info/sparse-checkout
          git fetch --depth 1 --filter=blob:none origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          python3 - <<'PY'
          import hashlib, pathlib, zlib
          raw = zlib.decompress(pathlib.Path('.github/review/dds-probe-cache.patch.zlib').read_bytes())
          assert hashlib.sha256(raw).hexdigest() == '9eaddc1de65e26c890c26a2a01bbf06b6d652955c32db8d73c0cba6dd1dc5b0e'
          pathlib.Path('/tmp/dds-probe-cache.patch').write_bytes(raw)
          PY
          cat > .git/info/sparse-checkout <<'EOF'
          /src/
          /tools/vita/
          /content/baseoq4/pak0/
          /.github/workflows/
          /docs/dev/releases/
          /README.md
          /AGENTS.md
          /meson.build
          EOF
          git fetch --depth 1 --filter=blob:none origin 4ab3da656bae7f80d85881ed148840121cd417ac
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = 4ab3da656bae7f80d85881ed148840121cd417ac
          git apply --index --whitespace=error-all /tmp/dds-probe-cache.patch
          git diff --cached --check
          git diff --cached --stat
          mkdir -p publication
          cp /tmp/dds-probe-cache.patch publication/reviewed.patch

      - name: Prepare pinned host-test dependency
        shell: bash
        run: |
          set -euo pipefail
          git init .tmp/vitagl
          git -C .tmp/vitagl remote add origin https://github.com/Rinnegatamante/vitaGL.git
          git -C .tmp/vitagl fetch --depth 1 origin eccee6d767ad5f632812414a6b8251031fe62f0b
          git -C .tmp/vitagl checkout --detach FETCH_HEAD
          python3 tools/vita/patch_vitagl_vita3k.py .tmp/vitagl | tee publication/dependency.log
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libgl1-mesa-dri

      - name: Run complete host suite and cache sanitizers
        shell: bash
        env:
          VOQ_VITAGL_SOURCE: ${{ github.workspace }}/.tmp/vitagl
          VITAGL_REPO: ${{ github.workspace }}/.tmp/vitagl
          VOQ_REQUIRE_GPU_TESTS: 1
          LIBGL_ALWAYS_SOFTWARE: 1
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/vita/tests -p 'test_*.py' -v 2>&1 | tee publication/tests.log
          VOQ_CACHE_SANITIZE=1 python3 -m unittest discover -s tools/vita/tests -p 'test_vita_gui_dds_probe_cache.py' -v 2>&1 | tee publication/cache-sanitizers.log
          git show HEAD:src/imagetools/Image_files.cpp > .tmp/dds-probe-original.cpp
          set +e
          VOQ_DDS_PROBE_SOURCE="$(realpath .tmp/dds-probe-original.cpp)" python3 -m unittest discover -s tools/vita/tests -p 'test_vita_gui_dds_probe_cache.py' -v > publication/negative-control.log 2>&1
          negative_status=$?
          set -e
          test "$negative_status" -ne 0
          grep -q 'FAILED (failures=1)' publication/negative-control.log
          grep -q 'test_growth_without_relocation' publication/negative-control.log
          grep -q 'exceeds 8192-byte test ceiling' publication/negative-control.log

      - name: Preserve canonical source blobs without updating refs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, io, json, os, pathlib, subprocess, tarfile, urllib.request
          def git(*args):
              return subprocess.check_output(['git', *args])
          expected = {
              'README.md',
              'docs/dev/releases/vita-0.1-dds-probe-cache.md',
              'src/imagetools/Image_files.cpp',
              'tools/vita/GAMEPLAY_DDS_PROBE_CACHE.md',
              'tools/vita/tests/test_vita_gui_dds_probe_cache.py',
          }
          paths = git('diff', '--cached', '--name-only', '-z').decode().strip('\0').split('\0')
          assert set(paths) == expected, paths
          base = git('rev-parse', 'HEAD').decode().strip()
          assert base == '4ab3da656bae7f80d85881ed148840121cd417ac'
          base_tree = git('rev-parse', 'HEAD^{tree}').decode().strip()
          assert base_tree == '20797e2a988cd7c473315fec1d3df981450d9298'
          def post(endpoint, data):
              req = urllib.request.Request(
                  'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + endpoint,
                  data=json.dumps(data).encode(), method='POST', headers={
                      'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                      'Accept': 'application/vnd.github+json',
                      'Content-Type': 'application/json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  })
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)
          entries, manifest = [], []
          with tarfile.open('publication/canonical-sources.tar.gz', 'w:gz') as archive:
              for path in sorted(paths):
                  data = git('show', ':' + path)
                  expected_blob = git('rev-parse', ':' + path).decode().strip()
                  result = post('/git/blobs', {'encoding': 'base64', 'content': base64.b64encode(data).decode()})
                  assert result['sha'] == expected_blob, path
                  entries.append({'path': path, 'type': 'blob', 'mode': '100644', 'sha': result['sha']})
                  manifest.append({'path': path, 'blob': result['sha'], 'sha256': hashlib.sha256(data).hexdigest()})
                  info = tarfile.TarInfo(path)
                  info.size, info.mode = len(data), 0o644
                  archive.addfile(info, io.BytesIO(data))
          tree = post('/git/trees', {'base_tree': base_tree, 'tree': entries})
          report = {
              'base_commit': base, 'base_tree': base_tree, 'tree_sha': tree['sha'],
              'patch_sha256': hashlib.sha256(pathlib.Path('/tmp/dds-probe-cache.patch').read_bytes()).hexdigest(),
              'files': manifest,
              'scope': 'Canonical source objects only; no production commit or branch ref was written.'
          }
          pathlib.Path('publication/publication.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report, indent=2))
          PY

      - name: Upload preparation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-dds-probe-cache-${{ github.sha }}
          path: publication/
          retention-days: 7
