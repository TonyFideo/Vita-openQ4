name: Prepare reviewed DDS staging sources

on:
  push:
    branches: [dds-streaming-preparation]
    paths:
      - .github/workflows/prepare-dds-streaming.yml
      - .github/review/dds-streaming.patch.xz
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Apply exact reviewed patch to immutable source
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config core.sparseCheckout true
          printf '/.github/review/dds-streaming.patch.xz\n' > .git/info/sparse-checkout
          git fetch --depth 1 --filter=blob:none origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          mkdir -p .tmp publication
          python3 - <<'PY'
          import hashlib, lzma, pathlib
          patch = lzma.decompress(pathlib.Path('.github/review/dds-streaming.patch.xz').read_bytes())
          assert hashlib.sha256(patch).hexdigest() == '0e304270057c6b62735db69f1c5e5830c3fa6bdcb660d9c7d1acef63fd17a425'
          pathlib.Path('.tmp/reviewed.patch').write_bytes(patch)
          pathlib.Path('publication/reviewed.patch').write_bytes(patch)
          PY
          cat > .git/info/sparse-checkout <<'EOF'
          /src/
          /tools/vita/
          /content/baseoq4/pak0/
          /.github/workflows/
          /docs/dev/releases/
          /README.md
          /AGENTS.md
          /meson.build
          EOF
          git fetch --depth 1 --filter=blob:none origin bebb9b1ca2563287acd98fb605e2b9f9cc26f95e
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = bebb9b1ca2563287acd98fb605e2b9f9cc26f95e
          git apply --index --whitespace=error-all .tmp/reviewed.patch
          git diff --cached --check
          git diff --cached --stat

      - name: Prepare pinned test dependency
        shell: bash
        run: |
          set -euo pipefail
          git init .tmp/vitagl
          git -C .tmp/vitagl remote add origin https://github.com/Rinnegatamante/vitaGL.git
          git -C .tmp/vitagl fetch --depth 1 origin eccee6d767ad5f632812414a6b8251031fe62f0b
          git -C .tmp/vitagl checkout --detach FETCH_HEAD
          python3 tools/vita/patch_vitagl_vita3k.py .tmp/vitagl | tee publication/dependency.log
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libgl1-mesa-dri

      - name: Execute complete host regression suite
        shell: bash
        env:
          VOQ_VITAGL_SOURCE: ${{ github.workspace }}/.tmp/vitagl
          VITAGL_REPO: ${{ github.workspace }}/.tmp/vitagl
          VOQ_REQUIRE_GPU_TESTS: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/vita/tests -p 'test_*.py' -v 2>&1 | tee publication/tests.log

      - name: Store source blobs without changing any branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, io, json, os, pathlib, subprocess, tarfile, urllib.request
          def git(*args):
              return subprocess.check_output(['git', *args])
          expected = {'README.md', 'docs/dev/releases/vita-0.1-dds-streaming.md',
              'src/imagetools/BinaryImage.cpp', 'src/imagetools/BinaryImage.h',
              'src/imagetools/Image_files.cpp', 'src/renderer/Image.h',
              'src/renderer/ImageManager.cpp', 'src/renderer/Image_load.cpp',
              'src/renderer/OpenGL/gl_Image.cpp', 'tools/vita/GAMEPLAY_DDS_STREAMING.md',
              'tools/vita/tests/test_vita_gui_dds_streaming.py'}
          paths = git('diff', '--cached', '--name-only', '-z').decode().strip('\0').split('\0')
          assert set(paths) == expected, paths
          base = git('rev-parse', 'HEAD').decode().strip()
          assert base == 'bebb9b1ca2563287acd98fb605e2b9f9cc26f95e'
          manifest = []
          with tarfile.open('publication/canonical-sources.tar.gz', 'w:gz') as archive:
              for path in sorted(paths):
                  data = git('show', ':' + path)
                  sha = git('rev-parse', ':' + path).decode().strip()
                  manifest.append({'path': path, 'blob': sha, 'sha256': hashlib.sha256(data).hexdigest(), 'published': False})
                  info = tarfile.TarInfo(path)
                  info.size, info.mode = len(data), 0o644
                  archive.addfile(info, io.BytesIO(data))
          report = {'base_commit': base, 'base_tree': git('rev-parse','HEAD^{tree}').decode().strip(),
              'files': manifest, 'scope': 'Source blobs only; no commit or ref is changed.'}
          output = pathlib.Path('publication/publication.json')
          output.write_text(json.dumps(report, indent=2) + '\n')
          for entry in manifest:
              data = git('show', ':' + entry['path'])
              req = urllib.request.Request('https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/git/blobs',
                  data=json.dumps({'encoding': 'base64', 'content': base64.b64encode(data).decode()}).encode(),
                  method='POST', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(req, timeout=60) as response:
                  result = json.load(response)
              assert result['sha'] == entry['blob'], entry['path']
              entry['published'] = True
              output.write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report, indent=2))
          PY

      - name: Preserve preparation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-dds-streaming-${{ github.sha }}
          path: publication/
          retention-days: 7
