name: GUI runtime regressions

on:
  push:
    branches: [vita-port]
    paths:
      - .github/workflows/gui-runtime-regressions.yml
      - src/ui/**
      - src/idlib/**
      - src/renderer/**
      - src/render_geo/**
      - src/imagetools/**
      - src/framework/Session.cpp
      - src/sys/vita/vita_main.cpp
      - tools/vita/patch_vitagl*.py
      - tools/vita/tests/test_vita_gui*.py
      - content/baseoq4/pak0/guis/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gui-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gui-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Source-only checkout
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config core.sparseCheckout true
          cat > .git/info/sparse-checkout <<'EOF'
          /src/ui/
          /src/idlib/
          /src/framework/
          /src/renderer/
          /src/render_geo/
          /src/imagetools/
          /src/sys/vita/
          /tools/vita/
          /content/baseoq4/pak0/guis/
          /.github/workflows/
          /AGENTS.md
          /meson.build
          EOF
          git fetch --depth 1 --filter=blob:none origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Fetch the renderer's pinned VitaGL source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp gui-diagnostics
          pin=$(sed -n 's/^  VITAGL_SHA: //p' .github/workflows/vita-sdk.yml)
          [[ "$pin" =~ ^[0-9a-f]{40}$ ]]
          git init .tmp/vitagl
          git -C .tmp/vitagl remote add origin https://github.com/Rinnegatamante/vitaGL.git
          git -C .tmp/vitagl fetch --depth 1 origin "$pin"
          git -C .tmp/vitagl checkout --detach FETCH_HEAD
          git -C .tmp/vitagl rev-parse HEAD > gui-diagnostics/vitagl-commit.txt
          git -C .tmp/vitagl archive HEAD | gzip > gui-diagnostics/vitagl-source.tar.gz
          python3 tools/vita/patch_vitagl_vita3k.py .tmp/vitagl | tee gui-diagnostics/vitagl-patch.log

      - name: Install offscreen OpenGL ES test runtime
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libgl1-mesa-dri

      - name: Run GUI regression tests
        shell: bash
        env:
          VOQ_VITAGL_SOURCE: ${{ github.workspace }}/.tmp/vitagl
          VOQ_REQUIRE_GPU_TESTS: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          mkdir -p gui-diagnostics
          python3 -m unittest discover -s tools/vita/tests -p 'test_vita_gui*.py' -v 2>&1 | tee gui-diagnostics/tests.log

      - name: Preserve exact source context
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p gui-diagnostics
          git rev-parse HEAD > gui-diagnostics/commit.txt
          git archive HEAD AGENTS.md meson.build src/ui src/idlib src/framework src/renderer src/render_geo src/imagetools src/sys/vita tools/vita content/baseoq4/pak0/guis .github/workflows | gzip > gui-diagnostics/gui-source.tar.gz

      - name: Upload GUI test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-runtime-${{ github.sha }}
          path: gui-diagnostics/
          retention-days: 7
