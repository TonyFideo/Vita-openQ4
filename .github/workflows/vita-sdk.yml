name: VitaSDK Smoke

on:
  push:
    branches:
      - vita-port
    paths:
      - .github/workflows/vita-sdk.yml
      - tools/vita/**
      - tools/build/meson_sources.py
      - meson.build
      - meson_options.txt
      - src/sys/sys_public.h
      - src/sys/vita/**
      - src/framework/**
      - src/idlib/precompiled.h
      - src/idlib/CryptoHash.*
  workflow_dispatch:

concurrency:
  group: vita-sdk-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  sdk-smoke:
    name: VitaSDK toolchain smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: vitasdk/vitasdk:latest
    env:
      VITASDK: /usr/local/vitasdk
      OPENQ4_GAMELIBS_REPO: ${{ github.workspace }}/../openQ4-game
      OPENQ4_GAMELIBS_SHA: 8f411dbc38efcb0f5f63b1c300ab220beb73808c
      VITAGL_REPO: ${{ github.workspace }}/.tmp/vitaGL
      VITAGL_SHA: eccee6d767ad5f632812414a6b8251031fe62f0b

    steps:
      - name: Partial sparse checkout
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config core.sparseCheckout true
          cat > .git/info/sparse-checkout <<'EOF'
          /meson.build
          /meson_options.txt
          /src/
          /tools/build/
          /tools/vita/
          /assets/icons/
          /assets/splash/
          EOF
          git fetch --depth 1 --filter=blob:none origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          git rev-parse HEAD

      - name: Fetch and stage pinned openQ4-game sources
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${OPENQ4_GAMELIBS_REPO}"
          git init "${OPENQ4_GAMELIBS_REPO}"
          git -C "${OPENQ4_GAMELIBS_REPO}" remote add origin https://github.com/themuffinator/openQ4-game.git
          git -C "${OPENQ4_GAMELIBS_REPO}" fetch --depth 1 --filter=blob:none origin "${OPENQ4_GAMELIBS_SHA}"
          git -C "${OPENQ4_GAMELIBS_REPO}" checkout --detach FETCH_HEAD
          test "$(git -C "${OPENQ4_GAMELIBS_REPO}" rev-parse HEAD)" = "${OPENQ4_GAMELIBS_SHA}"
          python3 tools/build/stage_gamelibs.py \
            "${GITHUB_WORKSPACE}" \
            "${OPENQ4_GAMELIBS_REPO}" \
            "${GITHUB_WORKSPACE}/.tmp/gamelibs_stage"
      - name: Verify VitaSDK toolchain
        shell: bash
        run: |
          set -euo pipefail
          test -d "$VITASDK"
          test -x "$VITASDK/bin/arm-vita-eabi-gcc"
          test -x "$VITASDK/bin/arm-vita-eabi-g++"
          test -f "$VITASDK/share/vita.toolchain.cmake"
          test -f "$VITASDK/share/vita.cmake"
          echo "VITASDK=$VITASDK"
          arm-vita-eabi-gcc --version | head -n 1
          arm-vita-eabi-g++ --version | head -n 1
          cmake --version | head -n 1

      - name: Build pinned VitaGL without splashscreen
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${VITAGL_REPO}"
          git init "${VITAGL_REPO}"
          git -C "${VITAGL_REPO}" remote add origin https://github.com/Rinnegatamante/vitaGL.git
          git -C "${VITAGL_REPO}" fetch --depth 1 origin "${VITAGL_SHA}"
          git -C "${VITAGL_REPO}" checkout --detach FETCH_HEAD
          test "$(git -C "${VITAGL_REPO}" rev-parse HEAD)" = "${VITAGL_SHA}"
          make -C "${VITAGL_REPO}" -j2 NO_SPLASHSCREEN=1 HAVE_VITA3K_SUPPORT=1
          cp "${VITAGL_REPO}/libvitaGL.a" "${VITASDK}/arm-vita-eabi/lib/libvitaGL.a"
          cp "${VITAGL_REPO}/source/vitaGL.h" "${VITASDK}/arm-vita-eabi/include/vitaGL.h"
          arm-vita-eabi-ar t "${VITASDK}/arm-vita-eabi/lib/libvitaGL.a" | head

      - name: Install Meson bring-up dependencies
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y --no-install-recommends python3-pip ninja-build
          python3 -m pip install --break-system-packages "meson>=1.6,<2"
          meson --version

      - name: Configure openQ4 for Vita ARMv7
        shell: bash
        run: |
          set -euo pipefail
          meson setup build/vita-config . \
            --cross-file tools/vita/meson-vita.ini \
            --backend ninja \
            --buildtype release \
            -Dplatform_backend=native \
            -Dbuild_engine=false \
            -Dbuild_games=false \
            -Dbuild_game_sp=false \
            -Dbuild_game_mp=false \
            -Dbuild_renderer_gl=false \
            -Dbuild_renderer_vk=false \
            -Duse_pch=false
      - name: Configure C++20 Vita smoke target
        shell: bash
        run: |
          set -euo pipefail
          cmake -S tools/vita/sdk_smoke -B build/vita-sdk-smoke \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VITASDK/share/vita.toolchain.cmake"

      - name: Build pre-render compile gates
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build/vita-sdk-smoke \
            --target \
              openq4_vita_prerender_platform_probe \
              openq4_vita_prerender_core_probe \
              openq4_vita_filesystem_probe \
            --parallel 2

      - name: Build pre-render ELF, SELF, and VPK
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build/vita-sdk-smoke --parallel 2

      - name: Validate Vita artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -f build/vita-sdk-smoke/vita_sdk_smoke
          test -f build/vita-sdk-smoke/vita_sdk_smoke.self
          test -f build/vita-sdk-smoke/openq4_vita_prerender
          test -f build/vita-sdk-smoke/openq4_vita_prerender.self
          test -f build/vita-sdk-smoke/Vita-OpenQ4.vpk
          arm-vita-eabi-readelf -h build/vita-sdk-smoke/openq4_vita_prerender
          ls -lh             build/vita-sdk-smoke/openq4_vita_prerender             build/vita-sdk-smoke/openq4_vita_prerender.self             build/vita-sdk-smoke/Vita-OpenQ4.vpk

      - name: Upload Vita pre-render artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vita-openq4-prerender
          path: |
            build/vita-sdk-smoke/openq4_vita_prerender
            build/vita-sdk-smoke/openq4_vita_prerender.self
            build/vita-sdk-smoke/Vita-OpenQ4.vpk
            build/vita-sdk-smoke/vita_sdk_smoke
            build/vita-sdk-smoke/vita_sdk_smoke.self
          if-no-files-found: error
