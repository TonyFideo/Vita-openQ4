name: VitaSDK Smoke

on:
  push:
    branches:
      - vita-port
    paths:
      - .github/workflows/vita-sdk.yml
      - tools/vita/**
      - tools/build/meson_sources.py
      - tools/build/openq4_pak.py
      - tools/build/build_openq4_pack.py
      - tools/build/write_pak_manifest.py
      - content/baseoq4/pak0/**
      - content/baseoq4/mod.json.in
      - meson.build
      - meson_options.txt
      - src/sys/sys_public.h
      - src/sys/vita/**
      - src/framework/**
      - src/renderer/**
      - src/sound/**
      - src/idlib/precompiled.h
      - src/idlib/CryptoHash.*
  workflow_dispatch:

concurrency:
  group: vita-sdk-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

env:
  VITASDK: /usr/local/vitasdk
  OPENQ4_GAMELIBS_SHA: 8f411dbc38efcb0f5f63b1c300ab220beb73808c
  VITAGL_SHA: eccee6d767ad5f632812414a6b8251031fe62f0b

jobs:
  renderer-gates:
    name: Renderer compile gates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: vitasdk/vitasdk:latest
    env:
      OPENQ4_GAMELIBS_REPO: ${{ github.workspace }}/../openQ4-game
      VITAGL_REPO: ${{ github.workspace }}/.tmp/vitaGL
    steps:
      - name: Partial sparse checkout
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config core.sparseCheckout true
          cat > .git/info/sparse-checkout <<'EOF'
          /meson.build
          /meson_options.txt
          /src/
          /tools/build/
          /tools/vita/
          /content/baseoq4/meson.build
          /content/baseoq4/mod.json.in
          /subprojects/stb_vorbis/
          EOF
          git fetch --depth 1 --filter=blob:none origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Fetch and stage pinned openQ4-game sources
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${OPENQ4_GAMELIBS_REPO}"
          git init "${OPENQ4_GAMELIBS_REPO}"
          git -C "${OPENQ4_GAMELIBS_REPO}" remote add origin https://github.com/themuffinator/openQ4-game.git
          git -C "${OPENQ4_GAMELIBS_REPO}" fetch --depth 1 --filter=blob:none origin "${OPENQ4_GAMELIBS_SHA}"
          git -C "${OPENQ4_GAMELIBS_REPO}" checkout --detach FETCH_HEAD
          test "$(git -C "${OPENQ4_GAMELIBS_REPO}" rev-parse HEAD)" = "${OPENQ4_GAMELIBS_SHA}"
          python3 tools/build/stage_gamelibs.py             "${GITHUB_WORKSPACE}"             "${OPENQ4_GAMELIBS_REPO}"             "${GITHUB_WORKSPACE}/.tmp/gamelibs_stage"

      - name: Verify VitaSDK toolchain
        shell: bash
        run: |
          set -euo pipefail
          test -x "$VITASDK/bin/arm-vita-eabi-g++"
          test -f "$VITASDK/share/vita.toolchain.cmake"

      - name: Stage pinned VitaGL header
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${VITAGL_REPO}"
          git init "${VITAGL_REPO}"
          git -C "${VITAGL_REPO}" remote add origin https://github.com/Rinnegatamante/vitaGL.git
          git -C "${VITAGL_REPO}" fetch --depth 1 origin "${VITAGL_SHA}"
          git -C "${VITAGL_REPO}" checkout --detach FETCH_HEAD
          python3 tools/vita/patch_vitagl_vita3k.py "${VITAGL_REPO}"
          cp "${VITAGL_REPO}/source/vitaGL.h" "$VITASDK/arm-vita-eabi/include/vitaGL.h"

      - name: Configure renderer gate targets
        shell: bash
        run: |
          set -euo pipefail
          cmake -S tools/vita/sdk_smoke -B build/vita-sdk-smoke             -DCMAKE_BUILD_TYPE=Release             -DCMAKE_TOOLCHAIN_FILE="$VITASDK/share/vita.toolchain.cmake"

      - name: Gate 1 - renderer state bridge
        shell: bash
        run: cmake --build build/vita-sdk-smoke --target openq4_vita_renderer_state_probe --parallel 4

      - name: Gate 2 - renderer startup negotiation
        shell: bash
        run: cmake --build build/vita-sdk-smoke --target openq4_vita_renderer_init_probe --parallel 4

      - name: Gate 3 - renderer API and capability model
        shell: bash
        run: cmake --build build/vita-sdk-smoke --target openq4_vita_renderer_system_probe --parallel 4

      - name: Gate 4 - complete GLES_D3 backend
        shell: bash
        run: cmake --build build/vita-sdk-smoke --target openq4_vita_glesd3_probe --parallel 4

      - name: Build remaining pre-render compile gates
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build/vita-sdk-smoke             --target               openq4_vita_prerender_platform_probe               openq4_vita_glimp_probe               openq4_vita_engine_entry_probe               openq4_vita_prerender_core_probe               openq4_vita_filesystem_probe             --parallel 4

  engine-integration:
    name: Full engine integration
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container: vitasdk/vitasdk:latest
    env:
      OPENQ4_GAMELIBS_REPO: ${{ github.workspace }}/../openQ4-game
      VITAGL_REPO: ${{ github.workspace }}/.tmp/vitaGL
    steps:
      - name: Partial sparse checkout
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config core.sparseCheckout true
          cat > .git/info/sparse-checkout <<'EOF'
          /meson.build
          /meson_options.txt
          /src/
          /tools/build/
          /tools/vita/
          /assets/icons/
          /assets/splash/
          /content/baseoq4/meson.build
          /content/baseoq4/mod.json.in
          /content/baseoq4/pak0/
          /subprojects/stb_vorbis/
          EOF
          git fetch --depth 1 --filter=blob:none origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Restore engine ccache
        uses: actions/cache@v4
        with:
          path: .ci-cache/ccache
          key: vita-engine-ccache-v1-${{ env.OPENQ4_GAMELIBS_SHA }}-${{ github.sha }}
          restore-keys: |
            vita-engine-ccache-v1-${{ env.OPENQ4_GAMELIBS_SHA }}-

      - name: Restore pinned VitaGL build
        uses: actions/cache@v4
        with:
          path: .ci-cache/vitagl
          key: vita-vitagl-v1-${{ env.VITAGL_SHA }}-${{ hashFiles('tools/vita/patch_vitagl_vita3k.py') }}

      - name: Restore Vita runtime pak0
        uses: actions/cache@v4
        with:
          path: .ci-cache/openq4-runtime
          key: vita-openq4-pak0-v1-${{ hashFiles('content/baseoq4/pak0/**', 'tools/build/openq4_pak.py', 'tools/build/build_openq4_pack.py', 'tools/build/write_pak_manifest.py') }}

      - name: Fetch and stage pinned openQ4-game sources
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${OPENQ4_GAMELIBS_REPO}"
          git init "${OPENQ4_GAMELIBS_REPO}"
          git -C "${OPENQ4_GAMELIBS_REPO}" remote add origin https://github.com/themuffinator/openQ4-game.git
          git -C "${OPENQ4_GAMELIBS_REPO}" fetch --depth 1 --filter=blob:none origin "${OPENQ4_GAMELIBS_SHA}"
          git -C "${OPENQ4_GAMELIBS_REPO}" checkout --detach FETCH_HEAD
          test "$(git -C "${OPENQ4_GAMELIBS_REPO}" rev-parse HEAD)" = "${OPENQ4_GAMELIBS_SHA}"
          python3 tools/build/stage_gamelibs.py             "${GITHUB_WORKSPACE}"             "${OPENQ4_GAMELIBS_REPO}"             "${GITHUB_WORKSPACE}/.tmp/gamelibs_stage"

      - name: Verify VitaSDK toolchain
        shell: bash
        run: |
          set -euo pipefail
          test -x "$VITASDK/bin/arm-vita-eabi-g++"
          test -f "$VITASDK/share/vita.toolchain.cmake"
          test -f "$VITASDK/share/vita.cmake"

      - name: Stage pinned VitaGL
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${VITAGL_REPO}"
          git init "${VITAGL_REPO}"
          git -C "${VITAGL_REPO}" remote add origin https://github.com/Rinnegatamante/vitaGL.git
          git -C "${VITAGL_REPO}" fetch --depth 1 origin "${VITAGL_SHA}"
          git -C "${VITAGL_REPO}" checkout --detach FETCH_HEAD
          test "$(git -C "${VITAGL_REPO}" rev-parse HEAD)" = "${VITAGL_SHA}"
          python3 tools/vita/patch_vitagl_vita3k.py "${VITAGL_REPO}"
          grep -q "shark_init_simple" "${VITAGL_REPO}/source/gxm.c"
          grep -q "sceGxmInitialize(&gxm_init_params)" "${VITAGL_REPO}/source/gxm.c"
          cp "${VITAGL_REPO}/source/vitaGL.h" "$VITASDK/arm-vita-eabi/include/vitaGL.h"

      - name: Install Meson, Ninja and ccache
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y --no-install-recommends python3-pip ninja-build ccache
          python3 -m pip install --break-system-packages "meson>=1.6,<2"

          JOBS="$(nproc)"
          if [ "$JOBS" -gt 4 ]; then JOBS=4; fi
          if [ "$JOBS" -lt 1 ]; then JOBS=1; fi
          echo "VITA_BUILD_JOBS=$JOBS" >> "$GITHUB_ENV"

          mkdir -p .ci-bin .ci-cache/ccache
          cat > .ci-bin/arm-vita-eabi-gcc <<'EOF'
          #!/bin/sh
          exec ccache /usr/local/vitasdk/bin/arm-vita-eabi-gcc "$@"
          EOF
          cat > .ci-bin/arm-vita-eabi-g++ <<'EOF'
          #!/bin/sh
          exec ccache /usr/local/vitasdk/bin/arm-vita-eabi-g++ "$@"
          EOF
          chmod +x .ci-bin/arm-vita-eabi-gcc .ci-bin/arm-vita-eabi-g++
          echo "${GITHUB_WORKSPACE}/.ci-bin" >> "$GITHUB_PATH"
          export CCACHE_DIR="${GITHUB_WORKSPACE}/.ci-cache/ccache"
          ccache --max-size=1536M
          ccache --zero-stats

      - name: Build or restore pinned VitaGL in Vita3K-safe mode
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-cache/vitagl
          if [ -f .ci-cache/vitagl/libvitaGL.a ]; then
            echo "Using cached libvitaGL.a"
          else
            make -C "${VITAGL_REPO}" -j"${VITA_BUILD_JOBS}" \
              NO_SPLASHSCREEN=1 HAVE_VITA3K_SUPPORT=1 HAVE_CUSTOM_HEAP=1 \
              SINGLE_THREADED_GC=1 LOG_ERRORS=1
            cp "${VITAGL_REPO}/libvitaGL.a" .ci-cache/vitagl/libvitaGL.a
          fi
          cp .ci-cache/vitagl/libvitaGL.a "$VITASDK/arm-vita-eabi/lib/libvitaGL.a"

      - name: Configure full Vita engine integration
        shell: bash
        run: |
          set -euo pipefail
          meson setup build/vita-engine-config .             --cross-file tools/vita/meson-vita.ini             --backend ninja             --buildtype release             -Dplatform_backend=native             -Dbuild_engine=true             -Dbuild_games=true             -Dbuild_game_sp=true             -Dbuild_game_mp=false             -Dbuild_renderer_gl=false             -Dbuild_renderer_vk=false             -Duse_pch=false

      - name: Test Vita helpers and build driver
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/vita/tests -p 'test_*.py' -v
          c++ -std=c++17 -Wall -Wextra -Werror tools/vita/tests/sound_stub_test.cpp -o build/sound_stub_test
          build/sound_stub_test
          c++ -std=c++17 -Wall -Wextra -Werror -Isrc/renderer/GLES \
            tools/vita/tests/vita_shader_compat_test.cpp \
            src/renderer/GLES/vita_glesd3_shader_compat.cpp \
            -o build/vita_shader_compat_test
          build/vita_shader_compat_test

      - name: Compile full Vita engine client
        shell: bash
        run: |
          set -euo pipefail
          CCACHE_DIR="${GITHUB_WORKSPACE}/.ci-cache/ccache" \
            python3 tools/vita/build_engine.py --build-dir build/vita-engine-config --jobs "${VITA_BUILD_JOBS}"
          ccache --show-stats

      - name: Package full Vita engine
        shell: bash
        run: |
          set -euo pipefail
          test -f build/vita-engine-config/openQ4-client_armv7
          test -f build/vita-engine-config/content/baseoq4/mod.json

          mkdir -p build/vita-runtime .ci-cache/openq4-runtime
          if [ -f .ci-cache/openq4-runtime/pak0.pk4 ]; then
            echo "Using cached openQ4 pak0.pk4"
            cp .ci-cache/openq4-runtime/pak0.pk4 build/vita-runtime/pak0.pk4
          else
            python3 tools/build/write_pak_manifest.py \
              "${GITHUB_WORKSPACE}" pak0.pk4 content/baseoq4/pak0 \
              build/vita-runtime/pak0.sources
            python3 tools/build/build_openq4_pack.py \
              --pak-name pak0.pk4 \
              --source-dir content/baseoq4/pak0 \
              --manifest build/vita-runtime/pak0.sources \
              --out build/vita-runtime/pak0.pk4
            cp build/vita-runtime/pak0.pk4 .ci-cache/openq4-runtime/pak0.pk4
          fi
          test -s build/vita-runtime/pak0.pk4

          {
            printf 'action=%s\n' "${GITHUB_RUN_NUMBER}"
            printf 'commit=%s\n' "${GITHUB_SHA}"
          } > build/vita-runtime/build.txt
          test -s build/vita-runtime/build.txt

          echo "Checking Vita ELF relocation set before vita-elf-create"
          if arm-vita-eabi-readelf -rW build/vita-engine-config/openQ4-client_armv7 | grep -q 'R_ARM_BASE_PREL'; then
            echo "::error::Unsupported R_ARM_BASE_PREL remains in the Vita ELF"
            arm-vita-eabi-readelf -rW build/vita-engine-config/openQ4-client_armv7 | grep 'R_ARM_BASE_PREL' | head -40
            exit 1
          fi
          cmake -S tools/vita/engine_package -B build/vita-engine-package             -DCMAKE_TOOLCHAIN_FILE="$VITASDK/share/vita.toolchain.cmake"             -DOPENQ4_ENGINE_ELF="${GITHUB_WORKSPACE}/build/vita-engine-config/openQ4-client_armv7" \
            -DOPENQ4_RUNTIME_MOD_JSON="${GITHUB_WORKSPACE}/build/vita-engine-config/content/baseoq4/mod.json" \
            -DOPENQ4_RUNTIME_PAK0="${GITHUB_WORKSPACE}/build/vita-runtime/pak0.pk4" \
            -DOPENQ4_BUILD_STAMP="${GITHUB_WORKSPACE}/build/vita-runtime/build.txt"
          cmake --build build/vita-engine-package --parallel "${VITA_BUILD_JOBS}"

      - name: Validate full Vita engine artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -f build/vita-engine-config/openQ4-client_armv7
          test -f build/vita-engine-package/eboot.bin
          test -f build/vita-engine-package/Vita-OpenQ4-engine.vpk
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          vpk = Path("build/vita-engine-package/Vita-OpenQ4-engine.vpk")
          with zipfile.ZipFile(vpk) as zf:
              names = set(zf.namelist())
              required = {"eboot.bin", "baseoq4/mod.json", "baseoq4/pak0.pk4", "build.txt"}
              missing = sorted(required - names)
              if missing:
                  raise SystemExit(f"VPK missing required runtime entries: {missing}")
              pak0 = zf.getinfo("baseoq4/pak0.pk4")
              if pak0.file_size < 1024 * 1024:
                  raise SystemExit(f"bundled pak0.pk4 is unexpectedly small: {pak0.file_size}")
              stamp = zf.read("build.txt").decode("utf-8")
              if "action=" not in stamp or "commit=" not in stamp:
                  raise SystemExit(f"invalid build.txt: {stamp!r}")
              print(f"Validated VPK runtime entries; pak0={pak0.file_size} bytes; {stamp.strip()}")
          PY
          arm-vita-eabi-readelf -h build/vita-engine-config/openQ4-client_armv7
          ls -lh             build/vita-engine-config/openQ4-client_armv7             build/vita-engine-package/eboot.bin             build/vita-engine-package/Vita-OpenQ4-engine.vpk

      - name: Upload full Vita engine artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vita-openq4-engine-${{ github.sha }}
          path: |
            build/vita-engine-config/openQ4-client_armv7
            build/vita-engine-package/eboot.bin
            build/vita-engine-package/Vita-OpenQ4-engine.vpk
          if-no-files-found: error

      - name: Upload Vita build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vita-openq4-diagnostics-${{ github.sha }}
          path: |
            build/vita-diagnostics/
            build/vita-engine-config/meson-logs/meson-log.txt
            build/vita-engine-config/compile_commands.json
          if-no-files-found: warn
