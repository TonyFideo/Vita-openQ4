name: Vita Render Probe

on:
  push:
    branches: [vita-port]
    paths:
      - .github/workflows/vita-render-probe.yml
      - tools/vita/render_probe/**
      - tools/vita/patch_vitagl_vita3k.py
      - src/sys/vita/vita_renderer_smoke.*
      - src/renderer/GLES/vita_glesd3_shader_compat.*
      - src/renderer/GLES_D3/glsl/**
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: vita-render-probe-${{ github.ref }}
  cancel-in-progress: false

env:
  VITASDK: /usr/local/vitasdk
  VITAGL_SHA: eccee6d767ad5f632812414a6b8251031fe62f0b

jobs:
  render-probe:
    name: Package isolated GLES_D3 material and depth probe
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    container: vitasdk/vitasdk:latest
    steps:
      - name: Sparse checkout renderer probe sources
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            tools/vita
            src/sys/vita
            src/renderer/GLES
            src/renderer/GLES_D3
      - name: Test geometry and projection on host
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/vita-render-probe
          c++ -std=c++17 -Wall -Wextra -Werror tools/vita/render_probe/scene_test.cpp -o build/probe-scene-test
          build/probe-scene-test
      - name: Build pinned VitaGL with the established Vita3K profile
        shell: bash
        run: |
          set -euo pipefail
          git init .tmp/vitaGL
          git -C .tmp/vitaGL remote add origin https://github.com/Rinnegatamante/vitaGL.git
          git -C .tmp/vitaGL fetch --depth 1 origin "$VITAGL_SHA"
          git -C .tmp/vitaGL checkout --detach FETCH_HEAD
          test "$(git -C .tmp/vitaGL rev-parse HEAD)" = "$VITAGL_SHA"
          python3 tools/vita/patch_vitagl_vita3k.py .tmp/vitaGL
          make -C .tmp/vitaGL -j2 NO_SPLASHSCREEN=1 HAVE_VITA3K_SUPPORT=1 HAVE_CUSTOM_HEAP=1 SINGLE_THREADED_GC=1 LOG_ERRORS=1 DEBUG_GLSL_TRANSLATOR=1
          cp .tmp/vitaGL/source/vitaGL.h "$VITASDK/arm-vita-eabi/include/vitaGL.h"
          cp .tmp/vitaGL/libvitaGL.a "$VITASDK/arm-vita-eabi/lib/libvitaGL.a"
      - name: Compile and package renderer test VPK
        shell: bash
        run: |
          set -euo pipefail
          cmake -S tools/vita/render_probe -B build/vita-render-probe \
            -DCMAKE_TOOLCHAIN_FILE="$VITASDK/share/vita.toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Release -DPROBE_BUILD_SHA="$GITHUB_SHA"
          cmake --build build/vita-render-probe --parallel 2
          test -s build/vita-render-probe/Vita-OpenQ4-render-probe.vpk
          arm-vita-eabi-readelf -h build/vita-render-probe/openq4_vita_render_probe
          printf 'commit=%s\nvitagl=%s\nkind=isolated-render-probe-not-full-engine\n' "$GITHUB_SHA" "$VITAGL_SHA" > build/vita-render-probe/BUILD.txt
          sha256sum build/vita-render-probe/Vita-OpenQ4-render-probe.vpk | tee -a build/vita-render-probe/BUILD.txt
      - name: Upload independently of full-engine compilation
        uses: actions/upload-artifact@v4
        with:
          name: vita-openq4-render-probe-${{ github.sha }}
          path: |
            build/vita-render-probe/Vita-OpenQ4-render-probe.vpk
            build/vita-render-probe/openq4_vita_render_probe.self
            build/vita-render-probe/openq4_vita_render_probe
            build/vita-render-probe/BUILD.txt
            tools/vita/render_probe/README.md
          if-no-files-found: error
