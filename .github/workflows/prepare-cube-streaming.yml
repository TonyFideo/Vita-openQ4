name: Prepare reviewed cube integration repair

on:
  push:
    branches: [cube-streaming-preparation]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Apply exact reviewed integration changes
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config core.sparseCheckout true
          cat > .git/info/sparse-checkout <<'EOF'
          /src/
          /tools/vita/
          /content/baseoq4/pak0/
          /.github/workflows/
          /README.md
          /AGENTS.md
          /meson.build
          EOF
          git fetch --depth 1 --filter=blob:none origin 4f4627b8935a5ba5ab506d9ff4c6ac4c050148ba
          git checkout --detach FETCH_HEAD
          mkdir -p publication
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path('src/renderer/Image_load.cpp')
          s = p.read_text()
          old = '#if defined(VITA) || defined(__vita__)\n#include "../sys/vita/vita_loading_hud.h"'
          assert s.count(old) == 1
          s = s.replace(old, '#if defined(VITA) || defined(__vita__)\n#include <psp2/kernel/clib.h>\n#include "../sys/vita/vita_loading_hud.h"')
          p.write_text(s)
          p = Path('.github/workflows/vita-sdk.yml')
          s = p.read_text()
          old = 'apt-get install -y --no-install-recommends python3-pip ninja-build ccache'
          assert s.count(old) == 1
          s = s.replace(old, old + ' libegl1 libgl1-mesa-dri')
          old = '      - name: Test Vita helpers and build driver\n        shell: bash\n        run: |\n          set -euo pipefail\n'
          assert s.count(old) == 1
          s = s.replace(old, old + '          export VOQ_VITAGL_SOURCE="$(realpath "${VITAGL_REPO}")"\n          export VOQ_REQUIRE_GPU_TESTS=1 LIBGL_ALWAYS_SOFTWARE=1\n')
          p.write_text(s)
          p = Path('tools/vita/GAMEPLAY_CUBE_STREAMING.md')
          s = p.read_text()
          s += '''
          ## Target integration and real PK4 coverage

          The first target attempt (#253) built the entire pinned VitaGL archive, but
          identified two integration errors: Image_load.cpp did not include the VitaSDK
          clib declaration used by its trace calls, and the engine test step did not
          provide VOQ_VITAGL_SOURCE although VITAGL_REPO was available. The follow-up
          includes the platform header explicitly and supplies the canonical test source
          path. The full-engine lane also installs the offscreen EGL runtime and requires
          GPU host tests, instead of weakening or skipping the new tests.

          An additional ASan/UBSan harness uses the repository's actual Unzip.cpp and the
          exact idFile_InZip Read/Length/destructor with stored and deflated synthetic
          PK4s. All 1152 combinations pass: six cube faces, native/camera orientation,
          raw/RLE gray/RGB/RGBA, source origins, gamma/downsize and every mip byte. This
          qualifies the real ZIP I/O integration; allocation/submission to GXM remain
          mocked. The harness and output are retained as supplemental evidence, not game
          asset or hardware validation.
          '''
          p.write_text(s)
          expected = {
              'src/renderer/Image_load.cpp': '960acc26da97cb1a82ed4be6655b9f2d69c5ba0f9749f41eee18e1b4d5fef660',
              '.github/workflows/vita-sdk.yml': 'fb8136212755a3dbcaba1a18e116ea90e8b897e1bd8cfa17e24ff6912e2c7634',
              'tools/vita/GAMEPLAY_CUBE_STREAMING.md': '86c6b89b19928ded1e06648f96996e5a6f2c1bbc9531526aa979988e42b6f2b3',
          }
          for name, digest in expected.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == digest, name
          PY
          git add src/renderer/Image_load.cpp .github/workflows/vita-sdk.yml tools/vita/GAMEPLAY_CUBE_STREAMING.md
          git diff --cached --check
          git diff --cached --binary > publication/reviewed.patch

      - name: Prepare pinned dependency and offscreen test runtime
        shell: bash
        run: |
          set -euo pipefail
          git init .tmp/vitagl
          git -C .tmp/vitagl remote add origin https://github.com/Rinnegatamante/vitaGL.git
          git -C .tmp/vitagl fetch --depth 1 origin eccee6d767ad5f632812414a6b8251031fe62f0b
          git -C .tmp/vitagl checkout --detach FETCH_HEAD
          python3 tools/vita/patch_vitagl_vita3k.py .tmp/vitagl | tee publication/dependency.log
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libgl1-mesa-dri

      - name: Run complete host suite
        shell: bash
        env:
          VOQ_VITAGL_SOURCE: ${{ github.workspace }}/.tmp/vitagl
          VITAGL_REPO: ${{ github.workspace }}/.tmp/vitagl
          VOQ_REQUIRE_GPU_TESTS: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/vita/tests -p 'test_*.py' -v 2>&1 | tee publication/tests.log

      - name: Store reviewed source blobs only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, io, json, os, pathlib, subprocess, tarfile, urllib.request
          def git(*args):
              return subprocess.check_output(['git', *args])
          paths = git('diff', '--cached', '--name-only', '-z').decode().strip('\0').split('\0')
          assert set(paths) == {'src/renderer/Image_load.cpp', '.github/workflows/vita-sdk.yml', 'tools/vita/GAMEPLAY_CUBE_STREAMING.md'}
          assert git('rev-parse','HEAD').decode().strip() == '4f4627b8935a5ba5ab506d9ff4c6ac4c050148ba'
          manifest = []
          with tarfile.open('publication/canonical-sources.tar.gz', 'w:gz') as archive:
              for path in sorted(paths):
                  data = git('show', ':' + path)
                  blob = git('rev-parse', ':' + path).decode().strip()
                  info = tarfile.TarInfo(path)
                  info.size, info.mode = len(data), 0o644
                  archive.addfile(info, io.BytesIO(data))
                  req = urllib.request.Request('https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/git/blobs',
                      data=json.dumps({'content': base64.b64encode(data).decode(), 'encoding':'base64'}).encode(), method='POST',
                      headers={'Authorization':'Bearer ' + os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json', 'Content-Type':'application/json'})
                  with urllib.request.urlopen(req,timeout=60) as response:
                      result = json.load(response)
                  assert result['sha'] == blob
                  manifest.append({'path':path, 'sha':blob, 'mode':'100644', 'type':'blob', 'sha256':hashlib.sha256(data).hexdigest()})
          pathlib.Path('publication/publication.json').write_text(json.dumps(manifest,indent=2)+'\n')
          print(json.dumps(manifest,indent=2))
          PY

      - name: Preserve integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-cube-integration-${{ github.sha }}
          path: publication/
          retention-days: 7
