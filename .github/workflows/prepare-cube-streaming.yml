name: Prepare reviewed cube streaming sources

on:
  push:
    branches: [cube-streaming-preparation]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Apply reviewed sources to the immutable build-252 base
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config core.sparseCheckout true
          printf '/.github/review/cube.part*\n' > .git/info/sparse-checkout
          git fetch --depth 1 --filter=blob:none origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          mkdir -p .tmp publication
          python3 - <<'PY'
          import hashlib, lzma, pathlib
          packed = b''.join(pathlib.Path('.github/review/cube.part' + str(i)).read_bytes() for i in range(3))
          patch = lzma.decompress(packed)
          assert hashlib.sha256(patch).hexdigest() == 'a8dfa42b0887874d21e6fdd554bbbf4adc0b7bb2b62e1c203f632a9754fab39b'
          pathlib.Path('.tmp/reviewed.patch').write_bytes(patch)
          pathlib.Path('publication/reviewed.patch').write_bytes(patch)
          PY
          cat > .git/info/sparse-checkout <<'EOF'
          /src/
          /tools/vita/
          /content/baseoq4/pak0/
          /.github/workflows/
          /docs/dev/releases/
          /README.md
          /AGENTS.md
          /meson.build
          EOF
          git fetch --depth 1 --filter=blob:none origin 12ee94a954c422d8521aceff7d43f6c6128bc5aa
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = 12ee94a954c422d8521aceff7d43f6c6128bc5aa
          git apply --index --whitespace=error-all .tmp/reviewed.patch
          python3 - <<'PY'
          import hashlib, pathlib
          p = pathlib.Path('.github/workflows/vita-sdk.yml')
          s = p.read_text()
          old = "hashFiles('tools/vita/patch_vitagl_vita3k.py')"
          assert s.count(old) == 1
          s = s.replace(old, "hashFiles('tools/vita/patch_vitagl*.py')")
          assert hashlib.sha256(s.encode()).hexdigest() == '610ac55c10a08349cecd904869431316440db5adeda969cfb975b159feca7a1f'
          p.write_text(s)
          PY
          git add .github/workflows/vita-sdk.yml
          git diff --cached --check
          git diff --cached --stat
          git diff --cached --binary > publication/complete.patch

      - name: Prepare pinned VitaGL and test runtime
        shell: bash
        run: |
          set -euo pipefail
          git init .tmp/vitagl
          git -C .tmp/vitagl remote add origin https://github.com/Rinnegatamante/vitaGL.git
          git -C .tmp/vitagl fetch --depth 1 origin eccee6d767ad5f632812414a6b8251031fe62f0b
          git -C .tmp/vitagl checkout --detach FETCH_HEAD
          python3 tools/vita/patch_vitagl_vita3k.py .tmp/vitagl | tee publication/dependency.log
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libgl1-mesa-dri

      - name: Execute complete host regression suite
        shell: bash
        env:
          VOQ_VITAGL_SOURCE: ${{ github.workspace }}/.tmp/vitagl
          VITAGL_REPO: ${{ github.workspace }}/.tmp/vitagl
          VOQ_REQUIRE_GPU_TESTS: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/vita/tests -p 'test_*.py' -v 2>&1 | tee publication/tests.log

      - name: Preserve and store source objects without changing production refs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, io, json, os, pathlib, subprocess, tarfile, urllib.request
          def git(*args):
              return subprocess.check_output(['git', *args])
          expected = {'README.md', '.github/workflows/vita-sdk.yml',
              'docs/dev/releases/vita-0.1-cube-streaming.md',
              'src/imagetools/CubeStream.h', 'src/imagetools/TgaStream.h',
              'src/imagetools/Image_files.cpp', 'src/renderer/Image_load.cpp',
              'src/renderer/OpenGL/gl_Image.cpp', 'tools/vita/GAMEPLAY_CUBE_STREAMING.md',
              'tools/vita/patch_vitagl_cube.py', 'tools/vita/patch_vitagl_vita3k.py',
              'tools/vita/tests/native/CubeStreamTest.cpp',
              'tools/vita/tests/test_vita_gui_cube_stream.py'}
          paths = git('diff', '--cached', '--name-only', '-z').decode().strip('\0').split('\0')
          assert set(paths) == expected, paths
          base = git('rev-parse', 'HEAD').decode().strip()
          assert base == '12ee94a954c422d8521aceff7d43f6c6128bc5aa'
          manifest = []
          with tarfile.open('publication/canonical-sources.tar.gz', 'w:gz') as archive:
              for path in sorted(paths):
                  data = git('show', ':' + path)
                  sha = git('rev-parse', ':' + path).decode().strip()
                  manifest.append({'path': path, 'blob': sha, 'sha256': hashlib.sha256(data).hexdigest(), 'published': False})
                  info = tarfile.TarInfo(path)
                  info.size, info.mode = len(data), 0o644
                  archive.addfile(info, io.BytesIO(data))
          report = {'base_commit': base, 'base_tree': git('rev-parse', 'HEAD^{tree}').decode().strip(),
              'files': manifest, 'scope': 'Only source blobs; production commits and refs are not modified.'}
          out = pathlib.Path('publication/publication.json')
          out.write_text(json.dumps(report, indent=2) + '\n')
          for entry in manifest:
              data = git('show', ':' + entry['path'])
              request = urllib.request.Request('https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/git/blobs',
                  data=json.dumps({'encoding': 'base64', 'content': base64.b64encode(data).decode()}).encode(),
                  method='POST', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  result = json.load(response)
              assert result['sha'] == entry['blob'], entry['path']
              entry['published'] = True
              out.write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report, indent=2))
          PY

      - name: Preserve reviewed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-cube-streaming-${{ github.sha }}
          path: publication/
          retention-days: 7
