[binaries]
c = 'arm-vita-eabi-gcc'
cpp = 'arm-vita-eabi-g++'
ar = 'arm-vita-eabi-ar'
strip = 'arm-vita-eabi-strip'
pkg-config = 'arm-vita-eabi-pkg-config'

[host_machine]
system = 'vita'
cpu_family = 'arm'
cpu = 'armv7-a'
endian = 'little'

[properties]
needs_exe_wrapper = true

[built-in options]
c_args = ['-fsigned-char', '-DVITA=1']
cpp_args = ['-fsigned-char', '-DVITA=1']
c_link_args = ['-Wl,-q', '-Wl,-z,nocopyreloc']
cpp_link_args = ['-Wl,-q', '-Wl,-z,nocopyreloc']
