// Native PlayStation Vita controller profile.
// The backend keeps physical controller identity in JOY1..JOY16; gameplay
// actions live here so menu navigation can continue to use Window.cpp's
// controller translation without platform-specific GUI hacks.

seta in_joystick "1"
seta in_joystickDeadZone "0.18"
seta in_joystickLookSensitivity "0.75"
seta in_joystickLookCurve "1.35"
seta in_joystickMoveCurve "1.0"
seta in_joystickInvertLook "0"
seta in_joystickSouthpaw "0"
seta in_joystickRumble "1"
seta in_joystickRumbleScale "1.0"

seta pm_ThumbstickConfig "0"
seta pm_ButtonConfig "0"
seta pm_HLookSens "1.0"
seta pm_VLookSens "1.0"
seta pm_HMoveSens "1.0"
seta pm_VMoveSens "1.0"

// Vita handheld:
// JOY1=L, JOY2=R, JOY3=Cross, JOY4=Circle,
// JOY5=Triangle, JOY6=Square, JOY7=Start, JOY8=Select,
// JOY9..JOY12=D-pad Up/Down/Right/Left.
bind "JOY1" "_zoom"
bind "JOY2" "_attack"
bind "JOY3" "_moveup"
bind "JOY4" "_movedown"
bind "JOY5" "_impulse50"
bind "JOY6" "_impulse13"
bind "JOY7" "togglemenu"
bind "JOY8" "_impulse19"
bind "JOY9" "_weaponWheel"
bind "JOY10" "centerview"
bind "JOY11" "_impulse15"
bind "JOY12" "_impulse14"

// Paired external controllers/PSTV retain their extra controls when available.
bind "JOY13" "_speed"
bind "JOY14" "centerview"
bind "JOY15" "_attack"
bind "JOY16" "_zoom"
